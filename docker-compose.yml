version: '3.8'

services:
  # ── 1. Pure Java 21 API Gateway & Ingress Router ────────────────────────────
  astro-api-gateway:
    image: astro-backend-astro-api-gateway:latest
    container_name: astro-api-gateway
    restart: unless-stopped
    ports:
      - "18080:18080"
      - "80:18080"
    environment:
      - SERVER_PORT=18080
      - ASTRO_CALC_WORKER_URL=http://astro-unified-engine:8081
      - ASTRO_AI_BASE_URL=http://astro-unified-engine:8081
      - ASTRO_MEDIA_BASE_URL=http://astro-unified-engine:8081
      - ASTRO_ENGINE_BASE_URL=http://astro-unified-engine:8081
      - ASTRO_REDIS_ENABLED=false
      - ASTRO_KAFKA_ENABLED=false
      - ASTRO_ELASTICSEARCH_ENABLED=false
      - ASTRO_SECURITY_ENABLED=true
      - ASTRO_ADMIN_API_KEY=ak_live_master_astro_2026
      - STRIPE_WEBHOOK_SECRET=whsec_live_demo_stripe_2026
      - RAZORPAY_WEBHOOK_SECRET=rzp_sec_demo_razorpay_2026
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    depends_on:
      astro-unified-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - astro-network

  # ── 2. Unified Calculation Engine & Embedded Relational Data Vault ──────────
  astro-unified-engine:
    image: astro-unified-engine:latest
    container_name: astro-unified-engine
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8083:8081"
      - "8084:8081"
    environment:
      - PORT=8081
      - PYTHONUNBUFFERED=1
      - VAULT_DB_PATH=/app/data/astro_vault.db
      - ASTRO_ADMIN_API_KEY=ak_live_master_astro_2026
    volumes:
      - astro-vault-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - astro-network

networks:
  astro-network:
    driver: bridge

volumes:
  astro-vault-data:
    driver: local
