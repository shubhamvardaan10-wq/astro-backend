events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream Microservice Definitions
    upstream gateway_upstream {
        server astro-api-gateway:18080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream calc_upstream {
        server astro-calc-engine:8081 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream ai_upstream {
        server astro-ai-rag-service:8083 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream media_upstream {
        server astro-media-export-service:8084 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ── 1. HTTP Server (Port 80) ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge for Let's Encrypt Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Edge Health
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","proxy":"astro-nginx-ingress","http":80}';
        }

        # Proxy directly or redirect
        location / {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── 2. HTTPS Secure Server (Port 443) ─────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Edge Ingress Health Check
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","proxy":"astro-nginx-ingress","ssl":true,"port":443}';
        }

        # Direct Calc Engine Route
        location /calc/ {
            proxy_pass http://calc_upstream/calc/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Direct AI & RAG Route
        location /ai/ {
            proxy_pass http://ai_upstream/ai/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Direct Media & Vision Route
        location /media/ {
            proxy_pass http://media_upstream/media/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Core API Gateway Route (All Astro Endpoints)
        location / {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
