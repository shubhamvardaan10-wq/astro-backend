server:
  port: ${SERVER_PORT:18080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/xml
    min-response-size: 2048
  shutdown: graceful

spring:
  application:
    name: astro-backend
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 3600
          must-revalidate: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Astro Backend
    description: Vedic + Western Astrology API (pure-Java Meeus ephemeris)
    version: 1.0.0
    disclaimer: >
      Astrological algorithms are traditional computational frameworks.
      Predictive validity is not scientifically established (Carlson, Nature 1985).

astro:
  geocoding:
    base-url: ${ASTRO_GEOCODER_URL:}
    timeout-seconds: ${ASTRO_GEOCODER_TIMEOUT_SECONDS:10}
  ai:
    enabled: ${ASTRO_AI_ENABLED:true}
    base-url: ${ASTRO_AI_BASE_URL:http://127.0.0.1:11434}
    model: ${ASTRO_AI_MODEL:qwen2.5:7b}
    timeout-seconds: ${ASTRO_AI_TIMEOUT_SECONDS:90}
    report-timeout-seconds: ${ASTRO_AI_REPORT_TIMEOUT_SECONDS:900}
  redis:
    enabled: ${ASTRO_REDIS_ENABLED:false}
  kafka:
    enabled: ${ASTRO_KAFKA_ENABLED:false}
    report-topic: ${ASTRO_KAFKA_REPORT_TOPIC:astro.report.requests}
    progress-topic: ${ASTRO_KAFKA_PROGRESS_TOPIC:astro.report.progress}
    telemetry-topic: ${ASTRO_KAFKA_TELEMETRY_TOPIC:astro.telemetry}
  elasticsearch:
    enabled: ${ASTRO_ELASTICSEARCH_ENABLED:false}
    index-name: ${ASTRO_ELASTICSEARCH_INDEX:astro_rules}
  worker:
    remote-url: ${ASTRO_CALC_WORKER_URL:}
    pool-size: ${ASTRO_WORKER_POOL_SIZE:4}
    timeout-seconds: ${ASTRO_WORKER_TIMEOUT_SECONDS:30}
    python: ${ASTRO_WORKER_PYTHON:}
    script: ${ASTRO_WORKER_SCRIPT:worker/daemon.py}
  media:
    base-url: ${ASTRO_MEDIA_BASE_URL:http://localhost:8084}
  cache:
    l1-enabled: ${ASTRO_L1_CACHE_ENABLED:true}
    l1-max-size: ${ASTRO_L1_CACHE_MAX_SIZE:10000}
    l1-ttl-minutes: ${ASTRO_L1_CACHE_TTL_MINUTES:60}

logging:
  level:
    root: INFO
    com.astro: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
